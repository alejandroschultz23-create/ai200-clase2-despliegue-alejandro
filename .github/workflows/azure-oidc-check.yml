name: Verificar Azure OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Autenticar con Azure usando OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar acceso de lectura
        run: |
          az group show \
            --name rg-ai200-clase2-oidc \
            --query "{name:name,location:location}" \
            --output table
